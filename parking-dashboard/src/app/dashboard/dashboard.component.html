<div>
  <h2>Ocupación</h2>
  <div class="stats-grid">
    <div class="card stat"><span>Vehículos estacionados</span><strong>{{ total() }}</strong></div>
    <div class="card stat"><span>Vehículos por cobrar</span><strong>{{ payableCount() }}</strong></div>
    <div class="card stat"><span>Tickets generados</span><strong>{{ summary()?.movements_count || 0 }}</strong></div>
    <div class="card stat"><span>Monto generado en tickets</span><strong>{{ currency }} {{ (summary()?.income || 0) | number:'1.2-2' }}</strong></div>
  </div>
</div>

<section class="card-container">
  <div class="card">
    <p>Registro de entrada rápido</p>
    <app-entry-form></app-entry-form>
  </div>
  <div class="card">
    <p>Registro de salida rápido</p>
    <app-exit-form></app-exit-form>
  </div>
</section>
